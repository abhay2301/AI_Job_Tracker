services:

  # --------------------------------------------------
  # Django Web Application
  # --------------------------------------------------
  web:
    build:
      context: ./backend
      dockerfile: ../docker/django/Dockerfile

    container_name: ai_job_tracker_web

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - app_network


  # --------------------------------------------------
  # PostgreSQL Database
  # --------------------------------------------------
  postgres:
    image: postgres:16

    container_name: ai_job_tracker_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - app_network


  # --------------------------------------------------
  # Redis
  # --------------------------------------------------
  redis:
    image: redis:7-alpine

    container_name: ai_job_tracker_redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    networks:
      - app_network


  # --------------------------------------------------
  # Celery Worker
  # --------------------------------------------------
  celery:
    build:
      context: ./backend
      dockerfile: ../docker/django/Dockerfile

    container_name: ai_job_tracker_celery

    command: celery -A config worker --loglevel=info

    volumes:
      - ./backend:/app

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - app_network


  # --------------------------------------------------
  # Nginx Reverse Proxy
  # --------------------------------------------------
  nginx:
    image: nginx:alpine

    container_name: ai_job_tracker_nginx

    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/static:/app/static
      - ./backend/media:/app/media

    depends_on:
      - web

    networks:
      - app_network


# --------------------------------------------------
# Persistent Volumes
# --------------------------------------------------
volumes:

  postgres_data:

  redis_data:


# --------------------------------------------------
# Network
# --------------------------------------------------
networks:

  app_network:
    driver: bridge